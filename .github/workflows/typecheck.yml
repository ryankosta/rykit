name: Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          #TODO what should I specify here
          python-version: "3.12"

      - name: Install Lint Tools
        run: uv sync --group lint

      - name: Run Mypy
        run: uv run mypy .
