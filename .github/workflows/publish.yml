name: Publish to PyPI

# This triggers the workflow when you publish a new GitHub Release
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    environment: pypi # Matches the environment you set up in PyPI/GitHub

    # IMPORTANT: This permission is required for Trusted Publishing (OIDC)
    permissions:
      id-token: write 
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build the package
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No username or password needed! The action handles it via OIDC
