[project]
name = "rykit"
description = "Various helpful tools for doing systems work"
readme = "README.md"
authors = [ 
    { name = "Ryan Kosta", email = "rkosta@ucsd.edu" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
# 1. Tell the project the version is dynamic
dynamic = ["version"]

[tool.uv]
packages = ["rykit"]

[build-system]
# 2. Switch to hatchling and include the hatch-vcs plugin
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# 3. Enable VCS (Git) versioning
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/rykit"]
